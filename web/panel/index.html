<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Jarvis panel</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b6cb0'/%3E%3Ccircle cx='16' cy='16' r='6' fill='white'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #f4f6fa;
        --surface: #ffffff;
        --text: #172033;
        --muted: #5a6478;
        --line: #d6dce8;
        --accent: #2b6cb0;
        --accent-text: #ffffff;
        --ok: #1f7a46;
        --ok-bg: #e0f3e8;
        --warn: #8a5a00;
        --warn-bg: #fdf0d0;
        --bad: #b42323;
        --bad-bg: #fbe3e3;
        --note-bg: #eef4ff;
        --flag-bg: #fff3dc;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1422;
          --surface: #172033;
          --text: #e8ecf5;
          --muted: #9aa6bf;
          --line: #2c3752;
          --accent: #5b9bea;
          --accent-text: #0b1220;
          --ok: #6fd69b;
          --ok-bg: #12331f;
          --warn: #f0c36a;
          --warn-bg: #3a2c0b;
          --bad: #ff8a8a;
          --bad-bg: #3d1717;
          --note-bg: #1a2a47;
          --flag-bg: #3a2c0b;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
      }
      #root {
        max-width: 720px;
        margin: 0 auto;
        padding: 16px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left));
      }
      h1,
      h2,
      h3 {
        margin: 0;
        line-height: 1.2;
      }
      h1 {
        font-size: 1.25rem;
      }
      h2 {
        font-size: 1.05rem;
        margin-bottom: 10px;
      }
      h3 {
        font-size: 0.95rem;
        margin-bottom: 8px;
        color: var(--muted);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
      }
      .bar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 14px;
      }
      label,
      .label {
        display: block;
        font-weight: 600;
        margin: 0 0 6px;
      }
      .field {
        margin-bottom: 14px;
      }
      .hint {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 4px 0 0;
        overflow-wrap: anywhere;
      }
      fieldset.plain {
        border: 0;
        padding: 0;
        min-width: 0;
      }
      legend {
        padding: 0;
      }
      input[type='text'],
      input[type='password'],
      input[type='url'],
      textarea {
        width: 100%;
        min-height: 48px;
        padding: 10px 12px;
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      textarea {
        min-height: 96px;
        resize: vertical;
      }
      input:focus-visible,
      textarea:focus-visible,
      button:focus-visible,
      .pick:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      button {
        min-height: 48px;
        padding: 10px 18px;
        font: inherit;
        font-weight: 600;
        color: var(--accent-text);
        background: var(--accent);
        border: 1px solid transparent;
        border-radius: 10px;
        cursor: pointer;
      }
      button.secondary {
        color: var(--text);
        background: transparent;
        border-color: var(--line);
      }
      button.danger {
        color: #fff;
        background: #c0392b;
      }
      button.small {
        min-height: 44px;
        padding: 8px 14px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .row > button {
        flex: 1 1 140px;
      }
      .modes {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }
      @media (min-width: 480px) {
        .modes {
          grid-template-columns: 1fr 1fr;
        }
      }
      .mode {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-height: 48px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        font-weight: 600;
      }
      .mode input {
        width: 22px;
        height: 22px;
        margin: 1px 0 0;
        flex: none;
      }
      .mode.on {
        border-color: var(--accent);
      }
      .mode.off {
        color: var(--muted);
        opacity: 0.7;
      }
      .mode small {
        display: block;
        font-weight: 400;
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 700;
        white-space: nowrap;
      }
      .badge.ok {
        color: var(--ok);
        background: var(--ok-bg);
      }
      .badge.warn {
        color: var(--warn);
        background: var(--warn-bg);
      }
      .badge.bad {
        color: var(--bad);
        background: var(--bad-bg);
      }
      .badge.idle {
        color: var(--muted);
        background: var(--bg);
        border: 1px solid var(--line);
      }
      .msg {
        margin: 10px 0 0;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 0.95rem;
        overflow-wrap: anywhere;
      }
      .msg.error {
        color: var(--bad);
        background: var(--bad-bg);
      }
      .msg.info {
        color: var(--ok);
        background: var(--ok-bg);
      }
      .meeting-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      .pick {
        display: block;
        width: 100%;
        min-height: 64px;
        padding: 12px;
        text-align: left;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      .pick .title {
        display: block;
        font-weight: 700;
        overflow-wrap: anywhere;
      }
      .pick .sub {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 6px;
        align-items: center;
        font-weight: 400;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .pick .sub .key {
        flex-basis: 100%;
        font-size: 0.8rem;
        overflow-wrap: anywhere;
      }
      .empty {
        color: var(--muted);
        margin: 0;
      }
      .feed {
        max-height: 46vh;
        overflow-y: auto;
        overscroll-behavior: contain;
        margin: 0;
        padding: 0;
        list-style: none;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
      }
      .feed li {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        overflow-wrap: anywhere;
      }
      .feed li:last-child {
        border-bottom: 0;
      }
      .who {
        font-weight: 700;
      }
      .when {
        color: var(--muted);
        font-size: 0.8rem;
        margin-left: 6px;
      }
      .notes li.note {
        background: var(--note-bg);
      }
      .notes li.flag {
        background: var(--flag-bg);
      }
      .counter {
        text-align: right;
        color: var(--muted);
        font-size: 0.9rem;
        margin: 4px 0 10px;
      }
      .counter.full {
        color: var(--bad);
        font-weight: 700;
      }
      .link-button {
        min-height: 44px;
        padding: 8px 4px;
        color: var(--accent);
        background: transparent;
        border: 0;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: no-preference) {
        button {
          transition: opacity 0.15s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/panel.js"></script>
  </body>
</html>
